services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -U account -d account
      interval: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account
    depends_on:
      postgres:
        condition: service_healthy
