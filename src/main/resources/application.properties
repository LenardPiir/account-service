spring.application.name=account-service

spring.datasource.url=jdbc:postgresql://localhost:5433/account
spring.datasource.username=account
spring.datasource.password=account

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

exchange.rates.EUR=1
exchange.rates.USD=1.1195
exchange.rates.SEK=11.1580
exchange.rates.GBP=0.84385

external-logging.url=https://httpbin.org/status/200
external-logging.connect-timeout=2s
external-logging.read-timeout=3s

springdoc.default-produces-media-type=application/json
